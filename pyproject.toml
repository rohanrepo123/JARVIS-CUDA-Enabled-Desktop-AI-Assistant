[project]
name = "jarvis-voice-agent"
version = "1.0.0"
description = "JARVIS — Local Voice AI Assistant powered by LangGraph + Ollama + Whisper + ElevenLabs"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
